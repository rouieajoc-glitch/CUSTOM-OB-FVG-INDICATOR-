name: Trade Test OB FVG
on:
  workflow_dispatch:
    inputs:
      symbols:
        default: BTCUSDT,ETHUSDT,SOLUSDT
      intervals:
        default: 1h,4h,1d
      null_test:
        description: "type null to run on random fake data instead of real data"
        default: "real"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run trade test
        env:
          SYMBOLS: ${{ inputs.symbols }}
          INTERVALS: ${{ inputs.intervals }}
          MODE: ${{ inputs.null_test }}
        run: python trade_test.py "$SYMBOLS" "$INTERVALS" "$MODE" | tee results_trade.txt
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results_trade.txt
