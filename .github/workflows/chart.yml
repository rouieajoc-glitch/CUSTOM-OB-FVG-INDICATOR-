name: Zone chart
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Symbols, comma separated
        default: BTCUSDT,ETHUSDT,SOLUSDT
      intervals:
        description: Timeframes (FVGs are drawn on 4h and up only)
        default: 30m,1h,4h,1d
      bars:
        description: Candles shown on the chart
        default: "150"
  # To send automatically every 4 hours, remove the # on the next 2 lines:
  schedule:
    - cron: "5 */4 * * *"
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install matplotlib
      - name: Draw zones and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOL: ${{ inputs.symbol }}
          INTERVALS: ${{ inputs.intervals }}
          BARS: ${{ inputs.bars }}
        run: python chart_zones.py "$SYMBOL" "$INTERVALS" "$BARS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charts
          path: charts/*.png
